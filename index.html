<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Universal Room Mechanism</title>
    
    <!-- 1. 引入 Tailwind CSS (样式) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. 引入 React 和 ReactDOM (核心库) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- 3. 引入 Babel (让浏览器能看懂 React 代码) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 字体 -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
      body {
        font-family: 'Noto Sans KR', 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      /* 隐藏滚动条但允许滚动 */
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <!-- 你的主要程序代码 -->
    <script type="text/babel">

      // --- ICONS (手动定义图标，避免依赖外部加载) ---
      const IconWrapper = ({ children, className, color }) => (
        <svg 
          xmlns="http://www.w3.org/2000/svg" 
          width="24" height="24" 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke={color || "currentColor"} 
          strokeWidth="2" 
          strokeLinecap="round" 
          strokeLinejoin="round" 
          className={className}
        >
          {children}
        </svg>
      );

      const ArrowRightIcon = (props) => <IconWrapper {...props}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></IconWrapper>;
      const CheckCircle2Icon = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></IconWrapper>;
      const LayersIcon = (props) => <IconWrapper {...props}><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></IconWrapper>;
      const SettingsIcon = (props) => <IconWrapper {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconWrapper>;
      const LightbulbIcon = (props) => <IconWrapper {...props}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-1 1.5-2.4 1.5-3.8 0-3.2-2.7-5.9-6-5.9S6 4.7 6 7.9c0 1.4.6 2.8 1.5 3.8.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></IconWrapper>;
      const AccessibilityIcon = (props) => <IconWrapper {...props}><circle cx="16" cy="4" r="1"/><path d="m18 19 1-7-6 1"/><path d="m5 8 3-3 5.5 3-2.36 4.5"/><path d="M8 19l-1-7 6 1"/></IconWrapper>;
      const ShieldCheckIcon = (props) => <IconWrapper {...props}><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></IconWrapper>;
      const EyeIcon = (props) => <IconWrapper {...props}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></IconWrapper>;


      // --- CONSTANTS & DATA ---
      const UserGroupType = {
        DEMENTIA: 'DEMENTIA',
        FALL_RISK: 'FALL_RISK',
        SENSORY: 'SENSORY',
        ALL: 'ALL'
      };

      const USER_GROUPS = [
        {
          id: UserGroupType.DEMENTIA,
          title: "경도/중등도 치매",
          subtitle: "인지 지원 (Cognitive Support)",
          colorTheme: {
            bg: "bg-indigo-50",
            border: "border-indigo-500",
            text: "text-indigo-700",
            heading: "text-indigo-900",
            light: "bg-indigo-100"
          },
          requirements: [
            "지남력(방향감각) 상실",
            "정서적 안정 필요",
            "고대비 시각적 단서",
            "명확한 이동 경로",
            "기억 회상 자극 (Memory Prompts)",
            "서카디안(일주기) 리듬 조명"
          ]
        },
        {
          id: UserGroupType.FALL_RISK,
          title: "낙상 고위험군",
          subtitle: "신체적 안전 (Physical Safety)",
          colorTheme: {
            bg: "bg-orange-50",
            border: "border-orange-500",
            text: "text-orange-800",
            heading: "text-orange-900",
            light: "bg-orange-100"
          },
          requirements: [
            "안정적인 지지 필요",
            "연속적인 핸드레일",
            "간호 구역 폭 ≥ 1.0m",
            "회전 반경 Ø1500",
            "낙상 감지 센서 조명",
            "양방향 도어 / 비상 호출"
          ]
        },
        {
          id: UserGroupType.SENSORY,
          title: "감각 기능 저하",
          subtitle: "편안함 & 명확성 (Comfort & Clarity)",
          colorTheme: {
            bg: "bg-emerald-50",
            border: "border-emerald-500",
            text: "text-emerald-800",
            heading: "text-emerald-900",
            light: "bg-emerald-100"
          },
          requirements: [
            "빛 민감도 증가",
            "시력 약화 (눈부심 방지)",
            "균일한 조도",
            "저반사 마감재",
            "단순화된 질감/텍스처",
            "명확한 정보 표지 (Signage)"
          ]
        }
      ];

      const DESIGN_FACTORS = {
        shared: [
          "전반적 안전성",
          "무장애 접근성 (Accessibility)",
          "위생 및 유지관리",
          "야간 조명",
          "미끄럼 방지 마감",
          "환기 시스템",
          "배리어 프리 화장실",
          "기본 조명 제어",
          "개인 수납공간"
        ],
        adaptive: [
          "가변 조명 시스템 (조광/조색)",
          "교체형 정보 레이어 (벽면/색상)",
          "모듈러 핸드레일 (탈부착 가능)",
          "이동식/가변형 가구",
          "다중 시나리오 조명 프리셋"
        ]
      };

      const ROOM_MODES = [
        {
          id: 'mode-a',
          modeName: "Mode A: 치매 대응 모드",
          description: "지남력 유지 및 인지 지원에 초점.",
          features: ["고대비", "메모리 월 활성화", "서카디안 조명"],
          targetGroup: UserGroupType.DEMENTIA
        },
        {
          id: 'mode-b',
          modeName: "Mode B: 낙상 예방 모드",
          description: "신체적 안정성 및 이동 지원에 초점.",
          features: ["전면 핸드레일", "장애물 없는 바닥", "저위치 조명"],
          targetGroup: UserGroupType.FALL_RISK
        },
        {
          id: 'mode-c',
          modeName: "Mode C: 감각 편안 모드",
          description: "시각적 편안함 및 심리적 안정에 초점.",
          features: ["부드러운 균일광", "무광 표면", "소음 저감"],
          targetGroup: UserGroupType.SENSORY
        }
      ];

      const VALUE_PROPS = [
        "운영 유연성: 재건축 없이 다양한 입소자 요구 수용 가능.",
        "Aging in Place (거주지 지속 거주): 입소자의 상태 변화에 매끄럽게 적응.",
        "프라이버시 & 존엄성: 개인화된 1인실에서의 높은 삶의 질.",
        "비용 효율성: 유닛 케어(Unit Care) 운영 모델에 부합.",
        "미래 대응: 고급 개별 케어 트렌드에 부합."
      ];

      // --- ARROW COMPONENTS ---
      const ArrowRight = ({ className, color = "#64748b" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      );

      const TripleMergeArrow = ({ className }) => {
        // Matching the user groups
        const cDementia = "#6366f1"; // Indigo-500
        const cFall = "#f97316";     // Orange-500
        const cSensory = "#10b981";  // Emerald-500
        const cMerge = "#64748b";    // Slate-500 (Neutral)

        // Coordinates
        const startX = 0;
        const endX = 95;
        const startYTop = 40;
        const startYMid = 150;
        const startYBot = 260;
        const endY = 150;

        // Control points for smoother Bezier curves
        const cp1X = 50; 

        return (
          <svg className={className} viewBox="0 0 100 300" fill="none" preserveAspectRatio="none">
            {/* Top Path (Dementia - Blue) */}
            <path 
              d={`M${startX} ${startYTop} C ${cp1X} ${startYTop}, ${cp1X} ${endY}, ${endX} ${endY}`}
              stroke={cDementia} 
              strokeWidth="1.5" 
              fill="none" 
              strokeLinecap="round"
            />
            
            {/* Middle Path (Fall Risk - Orange) */}
            <path 
              d={`M${startX} ${startYMid} L ${endX} ${endY}`}
              stroke={cFall} 
              strokeWidth="1.5" 
              fill="none" 
              strokeLinecap="round"
            />

            {/* Bottom Path (Sensory - Green) */}
            <path 
              d={`M${startX} ${startYBot} C ${cp1X} ${startYBot}, ${cp1X} ${endY}, ${endX} ${endY}`}
              stroke={cSensory} 
              strokeWidth="1.5" 
              fill="none" 
              strokeLinecap="round"
            />

            {/* Arrowhead at Convergence Point */}
            <path 
              d={`M${endX} ${endY} L ${endX - 6} ${endY - 4} L ${endX - 6} ${endY + 4} Z`} 
              fill={cMerge} 
              stroke={cMerge} 
              strokeWidth="1"
              transform={`translate(2, 0)`} 
            />
          </svg>
        );
      };

      const SingleToMultiArrow = ({ className }) => {
         const arrowColor = "#64748b"; // Slate-500

         return (
          <svg className={className} viewBox="0 0 100 24" fill="none" preserveAspectRatio="none">
            {/* Simple thin straight line */}
            <path 
              d="M0 12 L 95 12" 
              stroke={arrowColor} 
              strokeWidth="1.5" 
              strokeLinecap="round" 
            />
            
            {/* Standard Arrowhead */}
            <path 
              d="M92 12 L 86 9 L 86 15 Z" 
              fill={arrowColor} 
              stroke={arrowColor}
              strokeWidth="1" 
              strokeLinejoin="round"
              transform="translate(3, 0)"
            />
          </svg>
         )
      }

      // --- MAIN APPLICATION COMPONENT ---
      const DesignMechanism = () => {
        const [hoveredGroup, setHoveredGroup] = React.useState(null);

        const getOpacityClass = (group) => {
          if (!hoveredGroup) return "opacity-100";
          return hoveredGroup === group ? "opacity-100 ring-2 ring-offset-2" : "opacity-40 grayscale";
        };

        return (
          <div className="w-full min-w-[1400px] bg-slate-50 p-8 overflow-x-auto">
            
            {/* Header */}
            <div className="mb-10 text-center">
              <h1 className="text-3xl font-bold text-slate-900 mb-2">Design Mechanism: The Adaptive Universal Room</h1>
              <p className="text-slate-500 font-medium">
                분석 단계 (세 가지 요구) <span className="mx-2">→</span> 
                추출 단계 (공통점 & 차이점) <span className="mx-2">→</span> 
                통합 단계 (하나의 가변형 솔루션)
              </p>
            </div>

            {/* Main Diagram Layout: Grid System */}
            <div className="grid grid-cols-12 gap-4 relative min-h-[700px]">
              
              {/* --- SECTION A: INPUT (User Groups) --- */}
              <div className="col-span-3 flex flex-col justify-between relative z-10">
                <h2 className="text-lg font-bold text-slate-700 mb-4 border-b-2 border-slate-200 pb-2 uppercase tracking-wider flex items-center gap-2">
                  <LayersIcon className="w-5 h-5" />
                  Phase A: 사용자 입력 (User Inputs)
                </h2>
                
                <div className="flex flex-col gap-6 h-full justify-center py-4">
                  {USER_GROUPS.map((group) => (
                    <div 
                      key={group.id}
                      className={`relative transition-all duration-300 ease-in-out transform hover:-translate-y-1 cursor-pointer rounded-xl border-l-4 shadow-md bg-white p-5 ${group.colorTheme.border} ${getOpacityClass(group.id)}`}
                      onMouseEnter={() => setHoveredGroup(group.id)}
                      onMouseLeave={() => setHoveredGroup(null)}
                    >
                      <div className="flex justify-between items-start mb-2">
                        <h3 className={`font-bold text-lg ${group.colorTheme.heading}`}>{group.title}</h3>
                        {group.id === UserGroupType.DEMENTIA && <LightbulbIcon className="w-5 h-5 text-indigo-500" />}
                        {group.id === UserGroupType.FALL_RISK && <ShieldCheckIcon className="w-5 h-5 text-orange-500" />}
                        {group.id === UserGroupType.SENSORY && <EyeIcon className="w-5 h-5 text-emerald-500" />}
                      </div>
                      <p className={`text-xs font-bold uppercase mb-3 ${group.colorTheme.text} opacity-80`}>{group.subtitle}</p>
                      
                      <ul className="space-y-1.5">
                        {group.requirements.map((req, idx) => (
                          <li key={idx} className="text-sm text-slate-600 flex items-start gap-2">
                            <span className={`mt-1.5 w-1.5 h-1.5 rounded-full flex-shrink-0 ${group.colorTheme.text.replace('text-', 'bg-')}`}></span>
                            {req}
                          </li>
                        ))}
                      </ul>
                    </div>
                  ))}
                </div>
              </div>

              {/* --- ARROW CONNECTORS A -> B --- */}
              <div className="col-span-1 flex items-center justify-center relative">
                <TripleMergeArrow className="w-full h-full py-8" />
              </div>

              {/* --- SECTION B: EXTRACTION (The Matrix) --- */}
              <div className="col-span-4 flex flex-col z-10">
                 <h2 className="text-lg font-bold text-slate-700 mb-4 border-b-2 border-slate-200 pb-2 uppercase tracking-wider flex items-center gap-2">
                  <SettingsIcon className="w-5 h-5" />
                  Phase B: 요소 추출 (Extraction)
                </h2>

                <div className="bg-white rounded-2xl border border-slate-300 shadow-xl h-full overflow-hidden flex flex-col">
                  <div className="bg-slate-800 text-white p-3 text-center font-bold tracking-wide">
                    디자인 요소 통합 매트릭스 (Integration Matrix)
                  </div>
                  
                  <div className="flex flex-1 divide-x divide-slate-200">
                    
                    {/* Column 1: Shared Common Needs */}
                    <div className="flex-1 p-4 bg-slate-50">
                      <div className="flex items-center gap-2 mb-3 justify-center">
                         <div className="p-1.5 bg-blue-100 rounded text-blue-700"><ShieldCheckIcon size={16}/></div>
                         <h3 className="font-bold text-slate-700 text-sm">공통 기반 (Universal Base)</h3>
                      </div>
                      <div className="space-y-2">
                        {DESIGN_FACTORS.shared.map((factor, i) => (
                          <div key={i} className="text-xs bg-white border border-slate-200 p-2 rounded shadow-sm text-slate-600 text-center font-medium">
                            {factor}
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Column 2: Differentiated Needs */}
                    <div className="flex-1 p-4 bg-white">
                       <div className="flex items-center gap-2 mb-3 justify-center">
                         <div className="p-1.5 bg-purple-100 rounded text-purple-700"><LayersIcon size={16}/></div>
                         <h3 className="font-bold text-slate-700 text-sm">특화 요구 (Specific Needs)</h3>
                      </div>
                      <div className="space-y-3 h-full flex flex-col justify-around">
                         <div className={`p-2 rounded border-l-2 border-indigo-500 bg-indigo-50 text-xs text-indigo-800 transition-opacity ${getOpacityClass(UserGroupType.DEMENTIA)}`}>
                            <strong>치매 (Dementia):</strong> 고대비, 기억 단서, 서카디안 리듬
                         </div>
                         <div className={`p-2 rounded border-l-2 border-orange-500 bg-orange-50 text-xs text-orange-800 transition-opacity ${getOpacityClass(UserGroupType.FALL_RISK)}`}>
                            <strong>낙상 (Fall Risk):</strong> 연속적 지지, 명확한 구역, 저위치 조명
                         </div>
                         <div className={`p-2 rounded border-l-2 border-emerald-500 bg-emerald-50 text-xs text-emerald-800 transition-opacity ${getOpacityClass(UserGroupType.SENSORY)}`}>
                            <strong>감각 (Sensory):</strong> 눈부심 방지, 무광 텍스처, 흡음
                         </div>
                      </div>
                    </div>

                    {/* Column 3: Adaptive Tech */}
                    <div className="flex-1 p-4 bg-gradient-to-b from-slate-50 to-blue-50/50">
                      <div className="flex items-center gap-2 mb-3 justify-center">
                         <div className="p-1.5 bg-teal-100 rounded text-teal-700"><SettingsIcon size={16}/></div>
                         <h3 className="font-bold text-slate-700 text-sm">가변 기술 (Adaptive Tech)</h3>
                      </div>
                      <p className="text-[10px] text-center text-slate-400 mb-2 italic">Enablers of flexibility</p>
                      <div className="space-y-2">
                        {DESIGN_FACTORS.adaptive.map((factor, i) => (
                          <div key={i} className="text-xs bg-white border-l-2 border-teal-400 p-2 rounded shadow-sm text-slate-700">
                            {factor}
                          </div>
                        ))}
                      </div>
                    </div>

                  </div>
                </div>
              </div>

              {/* --- ARROW CONNECTORS B -> C --- */}
              <div className="col-span-1 flex items-center justify-center">
                 <SingleToMultiArrow className="w-full h-16" />
              </div>

              {/* --- SECTION C: OUTPUT (Adaptive Room) --- */}
              <div className="col-span-3 flex flex-col z-10">
                <h2 className="text-lg font-bold text-slate-700 mb-4 border-b-2 border-slate-200 pb-2 uppercase tracking-wider flex items-center gap-2">
                  <AccessibilityIcon className="w-5 h-5" />
                  Phase C: 솔루션 (The Solution)
                </h2>
                
                <div className="bg-white rounded-2xl border-2 border-slate-800 shadow-2xl p-1 h-full flex flex-col">
                   {/* Core Concept */}
                   <div className="bg-slate-800 text-white rounded-t-xl p-6 text-center">
                      <h3 className="text-2xl font-bold mb-1">가변형 유니버설 룸</h3>
                      <p className="text-slate-300 text-sm italic">"하나의 공간 구조, 세 가지 활성 모드"</p>
                   </div>

                   {/* Visualization of Modes */}
                   <div className="flex-1 p-4 space-y-4">
                      {ROOM_MODES.map((mode) => (
                        <div 
                          key={mode.id}
                          className={`p-3 rounded-lg border transition-all duration-300 ${
                            hoveredGroup === mode.targetGroup 
                              ? "bg-slate-100 border-slate-400 scale-105 shadow-md" 
                              : hoveredGroup 
                                ? "opacity-30 border-dashed" 
                                : "bg-white border-slate-200"
                          }`}
                        >
                          <div className="flex items-center justify-between mb-1">
                             <span className="font-bold text-sm text-slate-800">{mode.modeName}</span>
                             <span className={`w-2 h-2 rounded-full ${
                               mode.targetGroup === UserGroupType.DEMENTIA ? 'bg-indigo-500' :
                               mode.targetGroup === UserGroupType.FALL_RISK ? 'bg-orange-500' : 'bg-emerald-500'
                             }`}></span>
                          </div>
